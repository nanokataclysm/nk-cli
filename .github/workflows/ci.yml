name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir "${{ runner.temp }}/nk-cli-wheel"
          python -m pip install --no-index --no-deps --force-reinstall "${{ runner.temp }}"/nk-cli-wheel/*.whl
      - name: Installed CLI smoke
        run: python tests/installed_smoke.py
      - name: CLI smoke
        run: |
          nk-cli --help
          nk-cli analyze --json
          nk-cli tools --json
          nk-cli targets --json
          nk-cli boundaries --manifest examples/repository-units.example.json --json
          # The example intentionally checks an offline localhost listener.
          nk-cli doctor --manifest examples/services.example.json || test "$?" -eq 1
          nk-cli reclaim --root . --depth 2 --json
      - name: Native PowerShell smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = nk-cli analyze --repo . --shell powershell --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $report.command_shell -ne 'powershell') { throw 'PowerShell analysis failed' }
          nk-cli analyze --repo . --shell powershell
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell text output failed' }
      - name: Stdlib-only guard
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          bad = []
          for p in Path("src").rglob("*.py"):
              tree = ast.parse(p.read_text())
              for node in ast.walk(tree):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods = [node.module.split(".")[0]]
                  for m in mods:
                      if m in {"nk_cli", "__future__"}:
                          continue
                      if m not in sys.stdlib_module_names:
                          bad.append(f"{p}:{m}")
          if bad:
              raise SystemExit("non-stdlib imports: " + ", ".join(bad))
          print("stdlib_only ok")
          PY
